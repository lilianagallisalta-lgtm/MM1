<ion-header>
  <ion-navbar>
    <ion-title>Resultados</ion-title>
  </ion-navbar>
</ion-header>

<ion-content class="Page">
  <ng-template #loading>
    <app-loading-overlay></app-loading-overlay>
  </ng-template>

  <div *ngIf="(result$ | async) as result; else loading"
       fxLayout="column"
       fxLayoutGap="2rem"
       class="min-h-full app-container m-auto">
    <child-see *ngIf="(child$ | async) as child"
               [child]="child"></child-see>

    <div fxLayout="column"
         fxLayoutGap="0.5rem">
      <h1 class="p-3 card-title">Indicadores</h1>

      <div fxLayout="column"
           fxLayoutGap="3rem"
           class="pt-4">

        <div *ngFor="let area of result?.areas?.data"
             fxLayout="column"
             fxLayoutAlign="start stretch"
             class="p-3">
          <div fxLayout="row wrap"
               fxLayoutAlign="start start"
               class="p-3 bg-white border rounded">
            <div fxLayout="column"
                 fxLayoutAlign="start center"
                 fxFlex="90" fxFlex.gt-xs="40" fxFlex.gt-sm="33"
                 [style.background-color]="area?.gaugeCardColor | safe: 'style'"
                 class="relative mx-auto -mt-8 sm:-ml-8 sm:mr-0 sm:-mt-8 p-3 rounded-lg shadow-lg">
              <ngx-gauge type="full"
                         [value]="(area?.percentage * 100) | number: '1.0-0'"
                         [thick]="10"
                         backgroundColor="#757575"
                         [foregroundColor]="area?.gaugeColor"
                         append="%"></ngx-gauge>

              <div fxLayout="column"
                   fxLayoutAlign="start center"
                   class="absolute pin w-full h-full">
                <ngx-gauge-label>
                  <div fxLayout="column"
                       fxLayoutAlign="center center"
                       fxLayoutGap="0.5rem"
                       class="w-32 h-32 bg-white rounded-full shadow">
                    <img [src]="area?.picture"
                         class="mx-auto w-16 h-auto">

                    <h1 class="text-base text-grey-800 uppercase font-bold">{{area?.name}}</h1>
                  </div>
                </ngx-gauge-label>
              </div>
            </div>

            <div fxLayout="column"
                 fxFlex="100" fxFlex.gt-xs="60" fxFlex.gt-sm="66">
              <p class="mt-3 sm:mt-0 p-3 text-2xl text-center">{{area?.info}}</p>
            </div>

            <div fxLayout="column"
                 fxFlex="90" fxFlex.gt-sm="1 1 auto"
                 class="ml-4 mt-4 md:mt-0">
              <h1 class="p-3 card-title">Juegos recomendados</h1>

              <div [innerHTML]="area?.games"></div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</ion-content>
