<ion-header>
  <ion-navbar>
    <button *ngIf="media.isActive('lt-sm')"
            ion-button menuToggle>
      <ion-icon name="menu"></ion-icon>
    </button>

    <ion-title>
      <div fxLayout="row"
           fxLayoutAlign="start center">
        <span>Mentes Mejorando</span>

        <span fxFlex></span>

        <me fxHide.lt-sm></me>
      </div>
    </ion-title>
  </ion-navbar>
</ion-header>

<ion-content class="Page">
  <div fxLayout="column"
       fxLayoutGap="1rem"
       class="app-container mx-auto">

    <div fxLayout="column"
         class="p-3 bg-white rounded shadow">
      <div fxLayout="row"
           fxLayoutAlign="space-between center">
        <h1 class="card-title">Mis niños</h1>

        <button ion-button
                color="secondary"
                (click)="addChild()">Agregar niño</button>
      </div>

      <div fxLayout="column"
           fxFlex="90" fxFlex.gt-md="80">
        <children-list></children-list>
      </div>
    </div>
