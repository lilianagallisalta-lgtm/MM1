<ion-content class="Page without-header">
  <div fxLayout="column"
       fxLayoutAlign.gt-sm="center center"
       class="min-h-full overflow-y-auto">
    <div fxLayout="column"
         class="bg-white rounded shadow-lg p-3 m-3 md:w-2/3">
      <div fxLayout="row wrap"
           fxLayoutAlign="center center"
           fxLayoutGap="1rem"
           class="py-3">
        <h1 class="text-3xl text-grey-800 text-center">Crea una cuenta <span class="text-teal-500 font-bold">gratuita</span></h1>

        <h2 class="text-lg text-grey-800 text-center py-2">(no necesitas tarjeta de crédito)</h2>
      </div>

      <div fxLayout="row"
           fxLayoutAlign="center center">
        <h2 class="text-2xl text-grey-800 p-3">¿Ya tienes una cuenta?</h2>

        <a (click)="login()" ripple
           class="text-2xl text-blue-700 bg-blue-50 p-3 rounded">Iniciar sesión</a>
      </div>

      <sign-up (success)="loggedIn()"></sign-up>
    </div>
  </div>
</ion-content>
