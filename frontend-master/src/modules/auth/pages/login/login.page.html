<ion-content class="Page without-header">
  <div fxLayout="column"
       fxLayoutAlign.gt-sm="center center"
       class="min-h-full overflow-y-auto">
    <div fxLayout="column"
         class="bg-white rounded shadow-lg p-3 m-3 md:w-1/3">
      <h1 class="text-3xl text-grey-800 text-center p-3">Ingresá tu usuario y contraseña</h1>

      <div fxLayout="row"
           fxLayoutAlign="center center">
        <h2 class="text-2xl text-grey-800 p-3">¿No tienes una cuenta?</h2>

        <a (click)="signup()" ripple
           class="text-2xl text-blue-700 bg-blue-50 p-3 rounded">Regístrate gratis!</a>
      </div>

      <login (success)="loggedIn()"></login>
    </div>
  </div>
</ion-content>
