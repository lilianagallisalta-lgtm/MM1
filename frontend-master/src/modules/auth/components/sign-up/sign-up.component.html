<form [formGroup]=form>
  <hk-list>
    <ion-item>
      <ion-label floating>Nombre</ion-label>
      <ion-input formControlName="firstname"
                 autocomplete="given-name"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label floating>Apellido</ion-label>
      <ion-input formControlName="lastname"
                 autocomplete="family-name"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label floating>E-mail</ion-label>
      <ion-input formControlName="email"
                 type="email"
                 autocomplete="email"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label floating>Contraseña</ion-label>
      <ion-input formControlName="password"
                 type="password"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label floating>Repetir contraseña</ion-label>
      <ion-input formControlName="passwordConfirmation"
                 type="password"></ion-input>
    </ion-item>

    <hk-list-actions>
      <span fxFlex></span>
      <button ion-button color="secondary" (click)="submit()">Aceptar</button>
    </hk-list-actions>
  </hk-list>
</form>
