<mde-popover #hkCalendarPopover="mdePopover"
             [mdePopoverCloseOnClick]="false"
             mdePopoverPositionY="below"
             (close)="close()">
  <div fxLayout="column"
       class="hk-datepicker-calendar">
    <div fxLayout="row"
         class="topbar-container">
      <div *ngIf="! view || view === 'days'"
           fxLayout="row"
           fxLayoutAlign="space-between center"
           fxFlexFill>
        <button ion-button
                hk-icon-button
                (click)="prevMonth()"><ion-icon name="arrow-back"></ion-icon></button>

        <span class="topbar-title" (click)="toggleView()">{{ barTitle }}</span>

        <button ion-button
                hk-icon-button
                (click)="nextMonth()"><ion-icon name="arrow-forward"></ion-icon></button>
      </div>

      <div *ngIf="view === 'years'"
           fxLayout="row"
           fxLayoutAlign="center center"
           fxFlexFill>
        <span class="topbar-title">Selecciona un año</span>
      </div>
    </div>

    <div *ngIf="! view || view === 'days'"
         fxFlex
         class="main-calendar-container calendar-days">
      <div class="main-calendar-day-names">
        <span class="day-name-unit" *ngFor="let name of dayNames">{{ name }}</span>
      </div>
      <div class="main-calendar-days">
        <span
          class="day-unit"
          *ngFor="let day of days; let i = index;"
          [ngClass]="{ 'is-prev-month': !day.inThisMonth, 'is-today': day.isToday, 'is-selected': day.isSelected, 'is-disabled': !day.isSelectable }"
          (click)="day.isSelectable && setDate(i)">
          {{ day.day }}
        </span>
      </div>
    </div>

    <div *ngIf="view === 'years'"
         fxLayout="column"
         fxFlex
         class="main-calendar-container calendar-years">
      <div fxLayout="column"
           fxLayoutAlign="start center"
           class="main-calendar-years overflow-y-auto">
        <span *ngFor="let year of years; let i = index;"
              class="year-unit"
              [ngClass]="{ 'is-selected': year.isThisYear }"
              (click)="setYear(i)">{{ year.year }}</span>
      </div>
    </div>
  </div>
</mde-popover>

<div fxLayout="column"
     class="relative">
  <div *ngIf="isOpened"
       (click)="toggle()"
       class="backdrop"></div>

  <div hk-item
       fxLayout="column"
       [mdePopoverTriggerFor]="hkCalendarPopover"
       [mdePopoverTargetAt]="targetElement"
       [mdePopoverTriggerOn]="'click'"
       (opened)="hkCalendarPopoverOpened()"
       class="cursor-pointer">
    <span class="hk-label">{{label}}</span>

    <div fxLayout="column">
      <span class="p-2 h-12">{{displayValue}}</span>

      <div class="hk-ink"></div>
    </div>
  </div>

  <mde-popover-target #targetElement="mdePopoverTarget"></mde-popover-target>
</div>
