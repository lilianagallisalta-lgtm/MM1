overwrite: true
schema: "http://localhost:8000/graphql"
documents: "src/graphql/**/*.graphql"
generates:
  src/graphql/generated/graphql.ts:
    plugins:
      - "typescript-common"
      - "typescript-client"
      - "typescript-server"
      - "typescript-apollo-angular"
      - "fragment-matcher"
  ./graphql.schema.json:
    plugins:
      - "introspection"
