<ng-template #loading>
  <hk-loading></hk-loading>
</ng-template>

<div *ngIf="(areas$ | async) as areas; else loading"
     fxLayout="column"
     fxLayoutGap="2rem"
     class="app-container m-auto">
  <div fxLayout="column">
    <h1 class="p-3 card-title">Indicadores</h1>

    <div fxLayout="row wrap">
      <div *ngFor="let area of areas"
           fxLayout="column"
           fxLayoutAlign="start stretch"
           fxFlex="100" fxFlex.gt-sm="33"
           class="p-3">
        <app-result-gauge [result]="area?.result"
                          [area]="area"
                          fxFlex>
          <div fxLayout="row"
               fxLayoutAlign="space-between center"
               class="w-full p-2">
            <img *ngIf="area?.result?.slug === 'bad' || area?.result?.slug === 'very bad'"
                 src="assets/icon/siren.svg"
                 class="siren mx-auto h-16 w-auto">

            <span fxFlex></span>

            <ion-button (click)="seeResult(area?.result)"
                        color="light">Ver más</ion-button>
          </div>
        </app-result-gauge>
