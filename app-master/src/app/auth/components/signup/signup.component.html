<ion-list *ngIf="form"
          [formGroup]="form">
  <hk-loading-overlay *ngIf="loading"></hk-loading-overlay>

  <ion-item>
    <ion-label position="floating">Nombre</ion-label>
    <ion-input formControlName="firstname"></ion-input>
  </ion-item>
  <hk-errors control="firstname"></hk-errors>

  <ion-item>
    <ion-label position="floating">Apellido</ion-label>
    <ion-input formControlName="lastname"></ion-input>
  </ion-item>
  <hk-errors control="lastname"></hk-errors>

  <ion-item>
    <ion-label position="floating">País</ion-label>
    <ion-input formControlName="country"></ion-input>
  </ion-item>
  <hk-errors control="country"></hk-errors>

  <ion-item>
    <ion-label position="floating">Provincia/Estado</ion-label>
    <ion-input formControlName="province"></ion-input>
  </ion-item>
  <hk-errors control="province"></hk-errors>

  <ion-item>
    <ion-label position="floating">E-mail</ion-label>
    <ion-input formControlName="email"
               type="email"
               autocomplete="email"></ion-input>
  </ion-item>
  <hk-errors control="email"></hk-errors>

  <ion-item>
    <ion-label position="floating">Contraseña</ion-label>
    <ion-input formControlName="password"
               type="password"></ion-input>
  </ion-item>
  <hk-errors control="password"></hk-errors>

  <ion-item>
    <ion-label position="floating">Repetir contraseña</ion-label>
    <ion-input formControlName="passwordConfirmation"
               type="password"></ion-input>
  </ion-item>
  <hk-errors control="passwordConfirmation"></hk-errors>

  <ion-item lines="full">
    <ion-checkbox formControlName="acceptTos" slot="start"></ion-checkbox>
    <ion-label translate>Acepto los Términos y Condiciones</ion-label>
    <ion-buttons slot="end">
      <ion-button routerLink="/tos" color="primary" fill="clear">Ver</ion-button>
    </ion-buttons>
  </ion-item>
  <hk-errors control="acceptTos"></hk-errors>

  <ion-button (click)="submit()"
              expand="full"
              shape="round"
              class="mx-4 my-3">Aceptar</ion-button>

  <p class="pb-2 text-center text-grey-800">
    Al registrarte estás aceptando nuestros
    <a href="/tos" target="_blank" class="text-sm no-underline">Términos y Condiciones</a>.
  </p>
</ion-list>
